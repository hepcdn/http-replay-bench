[package]
name = "http-replay-bench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
flate2 = "1.1.9"
futures = "0.3.34"
http = "1.5.0"
indicatif = "0.18.6"
nix = { version = "0.31.3", features = ["user"] }
rand = { version = "0.10.2", features = ["chacha"] }
reqwest = "0.13.4"
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.8.3"
predicates = "3.1.4"
tempfile = "3.27.0"
